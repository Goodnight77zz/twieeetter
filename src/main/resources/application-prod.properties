# === Server configuration ===
server.port=${SERVER_PORT:8080}

# === File upload directory (Linux server) ===
file.upload.dir=${FILE_UPLOAD_DIR:/root/fyp_uploads/}

# === Database configuration (server MySQL) ===
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/twieeetter_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# === Meilisearch configuration (server) ===
meilisearch.enabled=${MEILISEARCH_ENABLED:false}
meilisearch.host=${MEILISEARCH_HOST:http://127.0.0.1:7700}
meilisearch.api-key=${MEILISEARCH_API_KEY:}
meilisearch.index=${MEILISEARCH_INDEX:tweets}

# === Mail configuration (server) ===
spring.mail.host=smtp.qq.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000

spring.cache.type=redis
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.digest.cron=${APP_DIGEST_CRON:0 0 8 * * ?}

app.security.dev-auto-login=false
