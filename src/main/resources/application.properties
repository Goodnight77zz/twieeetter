# === ???? ===
spring.application.name=twieeetter-backend

# ? ???? dev (??) ??
# ???? IDEA ????????? application-dev.properties
# ?????????? --spring.profiles.active=
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# === JPA ???? ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# === ?????? ===
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-part-count=50

# === DeepSeek AI ?? (??) ===
deepseek.api.url=https://api.deepseek.com/chat/completions
deepseek.api.key=${DEEPSEEK_API_KEY:}

# === RAG / Embedding configuration ===
rag.enabled=${RAG_ENABLED:false}
rag.db.url=${RAG_DB_URL:jdbc:postgresql://127.0.0.1:5432/twieeetter_rag}
rag.db.username=${RAG_DB_USERNAME:twieeetter}
rag.db.password=${RAG_DB_PASSWORD:}
rag.embedding.api.url=${EMBEDDING_API_URL:https://api.vectorengine.ai/v1/embeddings}
rag.embedding.api.key=${EMBEDDING_API_KEY:}
rag.embedding.model=${EMBEDDING_MODEL:text-embedding-3-large}
rag.embedding.dimension=${EMBEDDING_DIMENSION:3072}
